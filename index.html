<!doctype html>
<html lang="en" data-level="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Principles Life Sciences</title>
<meta name="description" content="Learn biology by operating the mechanism before naming it. Twenty-five interactive modules for ages 5 to 16.">
<meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<!-- Only the body face is preloaded (25.1 KB). Baloo 2 is display-only and
     uses font-display:optional, so it never blocks and never shifts layout. -->
<link rel="preload" href="assets/fonts/nunito-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/nunito-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>

<!-- One stylesheet, concatenated by tools/build.mjs from the four in css/.
     They stay four files to author and become one to ship: four render-blocking
     requests cost 680ms of first paint, measured. -->
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="app-bar">
  <a class="brand" href="#/">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <circle cx="16" cy="16" r="13" fill="var(--w-origins-fill)" stroke="var(--w-origins-line)" stroke-width="2.5"/>
      <circle cx="13.5" cy="14" r="4.6" fill="var(--w-origins-deep)"/>
      <circle cx="22" cy="20.5" r="2.2" fill="var(--w-origins-line)"/>
      <circle cx="9.5" cy="22.5" r="1.6" fill="var(--w-origins-line)"/>
    </svg>
    <span>Life Sciences</span>
  </a>
  <span class="spacer"></span>
  <a class="bar-link" href="#/me">Me</a>
</header>

<main id="main" tabindex="-1"></main>

<!-- Route announcements for screen readers; the router writes the new heading
     here so a navigation is audible, not just visible. -->
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<noscript>
  <p style="max-width:40rem;margin:2rem auto;padding:0 1rem">
    This is an interactive platform — every lesson is a simulation you operate,
    so it needs JavaScript switched on. There is no reading-only version,
    because a reading-only version would not teach the thing.
  </p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
